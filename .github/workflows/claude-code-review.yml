name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # A Dependabot PR cannot read this repo's Actions secrets — GitHub withholds
    # them from bot-authored runs — so the action fails its own env validation
    # and the PR carries a red that says nothing about the change it proposes.
    # Receipt (faf-cli, 2026-09-23): the last 8 human PRs all passed this
    # workflow and both Dependabot PRs failed on that error alone. A dependency
    # bump is Dependabot's diff to justify, not Claude's.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

      # The action hides its output, so a failed run shows only "is_error:true".
      # Print the final result message alone (the API error text, e.g. an
      # invalid key or low credit balance) so the cause is readable in the log
      # and in the run annotations, without enabling show_full_output.
      - name: Report review failure reason
        if: steps.claude-review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          FILE="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -f "$FILE" ]; then
            echo "::warning title=Claude Code Review::No execution log at $FILE"
            exit 0
          fi
          REASON=$(jq -r '[.[] | select(.type == "result")] | last | .result // "no result message"' "$FILE" | head -c 500 | tr '\n' ' ')
          echo "::warning title=Claude Code Review failed::$REASON"
