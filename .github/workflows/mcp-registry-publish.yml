name: 📡 MCP Registry Publish (DNS)

# DNS-authenticated registry publish for the one.faf/* namespace. GitHub-OIDC
# only authorises io.github.<owner>/* — DNS auth proves ownership of faf.one →
# authorises one.faf/*. Fires on every release so the registry stays current
# automatically; no manual `mcp-publisher login dns` step in /pubpro.
#
# Requires repo secret FAF_ONE_MCP_PRIVATE_KEY = the ed25519 private key (64-hex)
# whose public key is the `v=MCPv1; k=ed25519; p=...` TXT record at the faf.one apex.
# Same pattern as claude-faf-mcp; faf-mcp ships one npm package and no mcpb.

on:
  release:
    types: [published]
  workflow_dispatch: {}  # manual trigger for backfills / retries

env:
  MCP_PUBLISHER_VERSION: v1.8.6
  # sha256 of mcp-publisher_linux_amd64.tar.gz at v1.8.6 (registry_1.8.6_checksums.txt)
  MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Require the DNS key secret
        env:
          KEY: ${{ secrets.FAF_ONE_MCP_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::FAF_ONE_MCP_PRIVATE_KEY is not set in this repo — one.faf/* cannot be published without it."; exit 1; }
          echo "✓ FAF_ONE_MCP_PRIVATE_KEY present (${#KEY} chars)"

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          set -e
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x ./mcp-publisher
          ./mcp-publisher --version

      - name: Verify server.json is one.faf/* and its version matches the release tag
        run: |
          NAME=$(jq -r '.name' server.json)
          case "$NAME" in one.faf/*) ;; *) echo "::error::server.json name '$NAME' is not one.faf/* — the DNS key cannot publish it"; exit 1;; esac
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            MANIFEST_VERSION=$(jq -r '.version' server.json)
            if [ "$TAG" != "$MANIFEST_VERSION" ]; then
              echo "::error::server.json version ($MANIFEST_VERSION) does not match release tag ($TAG). Bump server.json before tagging."
              exit 1
            fi
            echo "✓ server.json v$MANIFEST_VERSION matches release tag v$TAG"
          fi

      - name: Skip publish if the registry already serves this version (idempotent backfills)
        id: served
        run: |
          NAME=$(jq -r '.name' server.json)
          VER=$(jq -r '.version' server.json)
          ENC=$(jq -rn --arg n "$NAME" '$n|@uri')
          GOT=$(curl -s "https://registry.modelcontextprotocol.io/v0.1/servers/${ENC}/versions/${VER}" | jq -r '.server.version // empty')
          if [ "$GOT" = "$VER" ]; then
            echo "::notice::registry already serves $NAME@$VER — nothing to publish (the registry rejects duplicate versions)"
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login via DNS (one.faf namespace; the key from the environment)
        if: steps.served.outputs.already != 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.FAF_ONE_MCP_PRIVATE_KEY }}
        run: node .github/scripts/registry-login.mjs --domain faf.one

      - name: Publish to MCP Registry (with retry on 5xx / timeout)
        if: steps.served.outputs.already != 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.FAF_ONE_MCP_PRIVATE_KEY }}
        run: |
          set +e
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Publish attempt $attempt/$MAX_ATTEMPTS"
            OUTPUT=$(./mcp-publisher publish server.json 2>&1)
            EXIT_CODE=$?
            echo "$OUTPUT"
            echo "::endgroup::"
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✓ Published to MCP Registry"
              exit 0
            fi
            # Detect transient errors (5xx, gateway timeouts, network)
            if echo "$OUTPUT" | grep -qE '50[0-9] Gateway|504|timeout|network|temporarily'; then
              SLEEP=$((attempt * attempt * 10))  # 10s, 40s, 90s, 160s, 250s — gives MCP Registry time to recover
              echo "Transient failure (attempt $attempt). Sleeping ${SLEEP}s then retrying..."
              sleep $SLEEP
              # Refresh the registry token in case it aged out during the wait
              node .github/scripts/registry-login.mjs --domain faf.one
              continue
            fi
            echo "::error::Non-transient publish failure on attempt $attempt — aborting."
            exit $EXIT_CODE
          done
          echo "::error::Publish failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Round-trip verify (registry serves this version)
        run: |
          NAME=$(jq -r '.name' server.json)
          VER=$(jq -r '.version' server.json)
          ENC=$(jq -rn --arg n "$NAME" '$n|@uri')
          for i in $(seq 1 10); do
            BODY=$(curl -s "https://registry.modelcontextprotocol.io/v0.1/servers/${ENC}/versions/${VER}")
            GOT=$(echo "$BODY" | jq -r '.server.version // empty')
            if [ "$GOT" = "$VER" ]; then
              echo "✓ registry serves $NAME@$VER"
              echo "$BODY" | jq -r '.server._meta["io.modelcontextprotocol.registry/publisher-provided"]["one.faf/context"] // "no one.faf/context _meta"' | head -20
              exit 0
            fi
            echo "⏳ registry not serving $VER yet (attempt $i/10)"; sleep 6
          done
          echo "::error::registry never served $NAME@$VER"; exit 1
